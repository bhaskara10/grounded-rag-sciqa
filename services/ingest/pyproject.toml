[project]
name = "sciqa-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "sciqa-schema",
    "sciqa-events",
    "sciqa-common",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
